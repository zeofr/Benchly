name: CI/CD Pipeline

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel redundant runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Global env ────────────────────────────────────────────────────────────────
env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BACKEND_IMAGE: benchmark-backend
  FRONTEND_IMAGE: benchmark-frontend

# ══════════════════════════════════════════════════════════════════════════════
# STAGE 1 — CONTINUOUS INTEGRATION
# ══════════════════════════════════════════════════════════════════════════════

# ── Job 1: Lint Backend ───────────────────────────────────────────────────────
jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run ESLint
        run: npm run lint
        working-directory: backend

      - name: Check JS syntax (all files)
        run: find src -name "*.js" | xargs -I{} node --check {}
        working-directory: backend

  # ── Job 2: Lint Frontend ────────────────────────────────────────────────────
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: frontend

  # ── Job 3: Backend Unit Tests ───────────────────────────────────────────────
  test-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run tests with coverage
        run: npm run test:ci
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci-only
          API_KEYS: demo-key-12345,test-key-67890

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # ── Job 4: Frontend Unit Tests ──────────────────────────────────────────────
  test-frontend:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests
        run: npm run test:ci
        working-directory: frontend

  # ── Job 5: Security Scan (npm audit) ────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit backend dependencies
        run: |
          npm ci
          npm audit --audit-level=critical
        working-directory: backend
        continue-on-error: true   # report but don't block on moderate/high

      - name: Audit frontend dependencies
        run: |
          npm ci
          npm audit --audit-level=critical
        working-directory: frontend
        continue-on-error: true

      - name: Check for secrets in code
        run: |
          # Fail if any real-looking secrets are found
          if grep -rn --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" \
            -E "(ghp_[a-zA-Z0-9]{36}|sk-[a-zA-Z0-9]{32,}|AKIA[A-Z0-9]{16})" \
            backend/src frontend/src 2>/dev/null; then
            echo "ERROR: Potential secrets found in source code"
            exit 1
          fi
          echo "No secrets detected in source code"

  # ── Job 6: Build Frontend ───────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build production bundle
        run: npm run build
        working-directory: frontend

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── Job 7: Build Backend Docker Image ───────────────────────────────────────
  build-backend-image:
    name: Build Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          build-args: INSTALL_K6=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Trivy vulnerability scan — backend
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Save backend image
        run: docker save ${{ env.BACKEND_IMAGE }}:${{ github.sha }} | gzip > /tmp/backend-image.tar.gz

      - name: Upload backend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: /tmp/backend-image.tar.gz
          retention-days: 1

  # ── Job 7b: Build Analytics Docker Image ────────────────────────────────────
  build-analytics-image:
    name: Build Analytics Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build analytics image
        uses: docker/build-push-action@v6
        with:
          context: ./analytics
          push: false
          tags: benchmark-analytics:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Trivy vulnerability scan — analytics
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: benchmark-analytics:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

  # ── Job 8: Build Frontend Docker Image ──────────────────────────────────────
  build-frontend-image:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Trivy vulnerability scan — frontend
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Save frontend image
        run: docker save ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} | gzip > /tmp/frontend-image.tar.gz

      - name: Upload frontend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: /tmp/frontend-image.tar.gz
          retention-days: 1

# ══════════════════════════════════════════════════════════════════════════════
# STAGE 2 — INTEGRATION TESTS (API health + k6 load test)
# Runs only on push to main/develop (not on PRs)
# ══════════════════════════════════════════════════════════════════════════════

  # ── Job 9: API Health + k6 Load Test ────────────────────────────────────────
  integration-test:
    name: Integration Tests and Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-backend-image, build-frontend-image, security-scan]
    if: github.event_name == 'push'

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: benchmarkdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Start backend server
        run: node src/index.js &
        working-directory: backend
        env:
          PORT: 4000
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: benchmarkdb
          DB_USER: postgres
          DB_PASSWORD: ci-test-password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          API_KEYS: demo-key-12345,test-key-67890
          LOG_LEVEL: warn
          OTEL_ENABLED: "false"

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health > /dev/null 2>&1; then
              echo "Backend ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"
          exit 1

      - name: API health check
        run: |
          echo "=== Health endpoint ==="
          curl -sf http://localhost:4000/health | python3 -m json.tool

          echo "=== Metrics endpoint ==="
          curl -sf http://localhost:4000/metrics | head -20

          echo "=== Auth check (expect 401) ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/api/benchmark)
          [ "$STATUS" = "401" ] && echo "Auth check passed (401)" || (echo "Expected 401, got $STATUS" && exit 1)

          echo "=== Authenticated request ==="
          curl -sf http://localhost:4000/api/benchmark \
            -H "X-API-Key: demo-key-12345" | python3 -m json.tool

      - name: Install k6
        run: |
          curl -L https://github.com/grafana/k6/releases/download/v0.49.0/k6-v0.49.0-linux-amd64.tar.gz \
            -o /tmp/k6.tar.gz
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo mv /tmp/k6-v0.49.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version

      - name: Run k6 load test
        run: |
          k6 run \
            --env BASE_URL=http://localhost:4000 \
            --out json=k6-results.json \
            backend/k6/ci-load-test.js
        continue-on-error: false   # fail pipeline if thresholds exceeded

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-load-test-results
          path: |
            k6-results.json
            ci-load-test-summary.json
          retention-days: 7

  # ── Job 9a: Kubernetes Manifest Validation ─────────────────────────────────
  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      - name: Validate manifests with dry-run
        # --dry-run=client validates YAML structure and API types without a cluster.
        # It catches typos in field names, wrong apiVersions, and missing required fields.
        run: |
          echo "=== Validating k8s manifests ==="
          for f in k8s/*.yaml; do
            echo "Checking: $f"
            kubectl apply --dry-run=client -f "$f" 2>&1 | head -5 || true
          done
          echo "=== Manifest validation complete ==="
        continue-on-error: true   # surface issues without blocking — cluster not available in CI

      - name: Check for placeholder values in manifests
        # Catch accidental commits of template placeholders
        run: |
          if grep -r "YOUR_DOCKERHUB_USERNAME\|REPLACE_WITH_BASE64_VALUE" k8s/ 2>/dev/null; then
            echo ""
            echo "WARNING: Placeholder values found in k8s manifests."
            echo "These are acceptable in secrets.yaml (documented) but check other files."
          else
            echo "No unresolved placeholders found."
          fi

  # ── Job 9b: PR Analytics & Regression Check ─────────────────────────────────
  pr-analytics:
    name: PR Performance Analytics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-backend]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Start backend server
        run: node src/index.js &
        working-directory: backend
        env:
          PORT: 4000
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: benchmarkdb
          DB_USER: postgres
          DB_PASSWORD: ci-test-password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          API_KEYS: demo-key-12345,test-key-67890
          LOG_LEVEL: warn
          OTEL_ENABLED: "false"

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Install k6
        run: |
          curl -L https://github.com/grafana/k6/releases/download/v0.49.0/k6-v0.49.0-linux-amd64.tar.gz -o /tmp/k6.tar.gz
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo mv /tmp/k6-v0.49.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version

      - name: Run k6 (PR quick run)
        run: |
          k6 run --env BASE_URL=http://localhost:4000 --out json=k6-results.json backend/k6/ci-load-test.js

      - name: Install Python deps for analytics
        run: |
          python -m pip install --upgrade pip
          pip install -r analytics/requirements.txt

      - name: Run analytics processor
        run: |
          python analytics/ingest_k6.py ci-load-test-summary.json > analytics-output.json || true

      - name: Run regression check
        run: |
          python analytics/check_regression.py ci-load-test-summary.json analytics/baseline.json


# ══════════════════════════════════════════════════════════════════════════════
# STAGE 3 — CONTINUOUS DEPLOYMENT
# Runs only on push to main after all CI jobs pass
# ══════════════════════════════════════════════════════════════════════════════

  # ── Job 10: Deploy to local Docker environment ───────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [integration-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend image
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: /tmp/

      - name: Download frontend image
        uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: /tmp/

      - name: Load Docker images
        run: |
          docker load < /tmp/backend-image.tar.gz
          docker load < /tmp/frontend-image.tar.gz
          docker images | grep benchmark

      - name: Tag images as latest
        run: |
          docker tag ${{ env.BACKEND_IMAGE }}:${{ github.sha }}  ${{ env.BACKEND_IMAGE }}:latest
          docker tag ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ${{ env.FRONTEND_IMAGE }}:latest

      - name: Create environment file
        run: |
          cat > .env << EOF
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'ci-deploy-password' }}
          JWT_SECRET=${{ secrets.JWT_SECRET || 'ci-deploy-jwt-secret' }}
          API_KEYS=${{ secrets.API_KEYS || 'demo-key-12345' }}
          GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD || 'admin' }}
          IMAGE_TAG=${{ github.sha }}
          EOF

      - name: Deploy with Docker Compose
        run: |
          docker compose up -d --remove-orphans
          echo "Waiting for services to be healthy..."
          sleep 15

      - name: Verify deployment health
        run: |
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Deployment healthy (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i/24: HTTP $STATUS — waiting 5s..."
            sleep 5
          done
          echo "Deployment health check failed — rolling back"
          docker compose down
          exit 1

      - name: Print deployment summary
        if: success()
        run: |
          echo ""
          echo "Deployment successful!"
          echo "  Commit:    ${{ github.sha }}"
          echo "  Branch:    ${{ github.ref_name }}"
          echo "  Triggered: ${{ github.actor }}"
          echo "  Time:      $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          docker compose ps

  # ── Job 11: Push to Docker Hub (optional — only when secrets are set) ────────
  push-images:
    name: Push Images to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [integration-test]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    # This job is skipped gracefully when DOCKERHUB_USERNAME is not set
    continue-on-error: true

    steps:
      - name: Check if Docker Hub secrets are configured
        id: check-secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "Docker Hub secrets not configured — skipping push"
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Download backend image
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: /tmp/

      - name: Download frontend image
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: /tmp/

      - name: Load images
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          docker load < /tmp/backend-image.tar.gz
          docker load < /tmp/frontend-image.tar.gz

      - name: Login to Docker Hub
        if: steps.check-secrets.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend image
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          docker tag ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker tag ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:latest

      - name: Push frontend image
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          docker tag ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker tag ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:latest
