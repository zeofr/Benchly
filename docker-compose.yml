# API Performance Benchmarking SaaS — Full Local Stack
# Includes: frontend, backend, worker, postgres, redis, prometheus, grafana, alertmanager

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: benchmark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       benchmarkdb
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Fix 3: Queue backend) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: benchmark-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_K6: "true"
    container_name: benchmark-backend
    restart: unless-stopped
    environment:
      PORT:           4000
      NODE_ENV:       development
      DB_HOST:        postgres
      DB_PORT:        5432
      DB_NAME:        benchmarkdb
      DB_USER:        postgres
      DB_PASSWORD:    ${POSTGRES_PASSWORD:-demo123}
      REDIS_HOST:     redis
      REDIS_PORT:     6379
      JWT_SECRET:     ${JWT_SECRET:-change-this-in-production}
      API_KEYS:       ${API_KEYS:-demo-key-12345}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL:      info
      OTEL_ENABLED:   "true"
      OTEL_SERVICE_NAME: benchmark-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Worker (Fix 2, 3, 16: Separate k6 runner) ────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_K6: "true"
    container_name: benchmark-worker
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    healthcheck:
      disable: true
    environment:
      NODE_ENV:    development
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     benchmarkdb
      DB_USER:     postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-demo123}
      REDIS_HOST:  redis
      REDIS_PORT:  6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANALYTICS_URL: http://analytics:8001
      LOG_LEVEL:   info
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: benchmark-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: benchmark-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: benchmark-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── AlertManager ─────────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: benchmark-alertmanager
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.3
    container_name: benchmark-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Analytics API (FastAPI + Pandas) ─────────────────────────────────────────
  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    container_name: benchmark-analytics
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Jaeger (Distributed Tracing) ─────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: benchmark-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP (used by backend)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  grafana_data:

networks:
  default:
    name: benchmark-network
