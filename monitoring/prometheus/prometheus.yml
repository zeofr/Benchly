global:
  scrape_interval:     15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Backend API metrics — request count, latency, error rate, queue depth
  - job_name: 'benchmark-backend'
    static_configs:
      - targets: ['backend:4000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Analytics FastAPI service — per-analysis counters and latency
  - job_name: 'benchmark-analytics'
    static_configs:
      - targets: ['analytics:8001']
    metrics_path: '/metrics'
    scrape_interval: 15s
