# Ingress — optional, provides hostname-based routing via benchmark.local
#
# Prerequisites:
#   minikube addons enable ingress
#   echo "$(minikube ip) benchmark.local" | sudo tee -a /etc/hosts
#
# Without Ingress, access services directly via NodePort:
#   Frontend:   http://$(minikube ip):30080
#   Grafana:    http://$(minikube ip):30300
#   Prometheus: http://$(minikube ip):30090

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: benchmark-ingress
  namespace: benchmark
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: benchmark.local
      http:
        paths:
          # API routes go directly to the backend Service
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          # All other traffic goes to the frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
