apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: benchmark
data:
  NODE_ENV:       "production"
  PORT:           "4000"
  DB_HOST:        "postgres"
  DB_PORT:        "5432"
  REDIS_HOST:     "redis"
  REDIS_PORT:     "6379"
  LOG_LEVEL:      "info"
  # Jaeger tracing — points to the in-cluster jaeger Service
  OTEL_ENABLED:          "true"
  OTEL_SERVICE_NAME:     "benchmark-backend"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
  # Analytics FastAPI service URL
  ANALYTICS_URL: "http://analytics:8001"
