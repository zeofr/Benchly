# Prometheus — metrics collection
#
# In Kubernetes, Prometheus needs to discover the backend pods.
# We use two approaches simultaneously:
#   1. Static config targeting the backend Service (simple, always works)
#   2. Pod annotation-based discovery (scales automatically with HPA replicas)
#
# The prometheus.yml is stored in a ConfigMap so we can update it without
# rebuilding any image.

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: benchmark
data:
  prometheus.yml: |
    global:
      scrape_interval:     15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      # Prometheus scrapes itself
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Backend API — scrape via Service (all replicas share one endpoint)
      # The Service load-balances, so we get aggregate metrics from one target.
      - job_name: 'benchmark-backend'
        static_configs:
          - targets: ['backend.benchmark.svc.cluster.local:4000']
        metrics_path: '/metrics'
        scrape_interval: 10s

      # Pod-level discovery — gets per-pod metrics when HPA scales replicas.
      # Requires pods to have these annotations (set in backend-deployment.yaml):
      #   prometheus.io/scrape: "true"
      #   prometheus.io/port: "4000"
      #   prometheus.io/path: "/metrics"
      - job_name: 'benchmark-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['benchmark']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: 'true'
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

  alerts.yml: |
    groups:
      - name: benchly-alerts
        rules:
          - alert: HighCPUUsage
            expr: rate(process_cpu_seconds_total[2m]) * 100 > 80
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage on backend"
              description: "CPU usage is {{ $value | printf \"%.1f\" }}%"

          - alert: HighErrorRate
            expr: |
              rate(http_requests_total{status_code=~"5.."}[5m])
              /
              rate(http_requests_total[5m]) * 100 > 5
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "High HTTP error rate"
              description: "Error rate is {{ $value | printf \"%.1f\" }}%"

          - alert: BackendDown
            expr: up{job="benchmark-backend"} == 0
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "Backend is down"
              description: "benchmark-backend has been unreachable for 30s"

          - alert: HPAAtMaxReplicas
            expr: kube_horizontalpodautoscaler_status_current_replicas{namespace="benchmark"} >= kube_horizontalpodautoscaler_spec_max_replicas{namespace="benchmark"}
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "HPA at maximum replicas"
              description: "The backend HPA has been at max replicas for 2 minutes"
---
# Prometheus needs cluster-wide read access to discover pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: benchmark
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: benchmark
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: benchmark
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.48.1
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=24h'
            - '--web.enable-lifecycle'
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: benchmark
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      nodePort: 30090
  type: NodePort
