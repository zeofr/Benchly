# ── Benchly Secrets ───────────────────────────────────────────────────────────
# ⚠️  This file contains PLACEHOLDER values only.
#     Never commit real secrets to source control.
#
# To apply real secrets, run the setup script instead:
#   ./scripts/k8s-secrets.sh
#
# Or apply manually:
#   kubectl create secret generic db-secret \
#     --from-literal=DB_USER=postgres \
#     --from-literal=DB_PASSWORD=demo123 \
#     --from-literal=DB_NAME=benchmarkdb \
#     --from-literal=JWT_SECRET=$(openssl rand -base64 32) \
#     --from-literal=API_KEYS=demo-key-12345 \
#     -n benchmark --dry-run=client -o yaml | kubectl apply -f -
#
#   kubectl create secret generic grafana-secret \
#     --from-literal=GF_SECURITY_ADMIN_PASSWORD=admin \
#     -n benchmark --dry-run=client -o yaml | kubectl apply -f -
#
# The values below are base64 of: postgres / demo123 / benchmarkdb / demo-key-12345
# These are DEMO values only — change for any real deployment.
# echo -n 'postgres'      | base64  → cG9zdGdyZXM=
# echo -n 'demo123'       | base64  → ZGVtbzEyMw==
# echo -n 'benchmarkdb'   | base64  → YmVuY2htYXJrZGI=
# echo -n 'demo-key-12345'| base64  → ZGVtby1rZXktMTIzNDU=

apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: benchmark
type: Opaque
data:
  DB_USER:     cG9zdGdyZXM=
  DB_PASSWORD: ZGVtbzEyMw==
  DB_NAME:     YmVuY2htYXJrZGI=
  JWT_SECRET:  Y2hhbmdlLXRoaXMtaW4tcHJvZHVjdGlvbi1taW5pbXVtLTMyLWNoYXJz
  API_KEYS:    ZGVtby1rZXktMTIzNDU=
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: benchmark
type: Opaque
data:
  # admin
  GF_SECURITY_ADMIN_PASSWORD: YWRtaW4=
