apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: benchmark
  labels:
    app: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8001"
        prometheus.io/path:   "/metrics"
    spec:
      containers:
        - name: analytics
          image: benchly-analytics:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          env:
            - name: OPENAI_API_KEY
              value: ""
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: analytics
  namespace: benchmark
spec:
  selector:
    app: analytics
  ports:
    - name: http
      port: 8001
      targetPort: 8001
  type: ClusterIP
