apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: benchmark
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: benchly-frontend:latest
          imagePullPolicy: Never
          ports:
            # nginx.conf listens on 8080 (non-root), NOT 80
            - containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 8080   # must match containerPort
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
---
# NodePort lets us access the frontend directly via:
#   minikube service frontend -n benchmark
# or:
#   http://$(minikube ip):30080
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: benchmark
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort
